[package]
name = "openidea-plugin-stock-watch"
version = "0.9.6"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]
exclude = ["vendor/openidea-plugin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `vendor/openidea-plugin` 是 SDK v0.1.40（API 1.4）的源码快照，Apache-2.0，随仓库一起提交，
# 这样在没有网络、或本机拉不了 git 依赖的机器上也能构建出同一份 wasm。
# 想改用上游依赖时，换成下面这行即可，源码是同一份：
#   openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.40" }
openidea-plugin = { path = "vendor/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 腾讯行情接口是 GBK，解析前先转成 UTF-8。
encoding_rs = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

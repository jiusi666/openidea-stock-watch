id = "fg.stock-watch"
name = "Stock Watch 股票盯盘"
version = "0.9.5"
description = "A 股自选与持仓的轻量盯盘工具：卡片 / 表格双视图、列表与表格列都能拖动排序、日内区间条、涨跌配色与隐匿模式，浮动盈亏本地计算。行情来自公开接口轮询，自选、持仓与偏好只留在本机。"
authors = ["九思"]
license = "Apache-2.0"
change-notes = "0.9.5 — 自选 / 持仓列表支持拖动排序（卡片与表格通用，按住行上下拖，带插入指示线，松手即记住）；提示改成底部浮层气泡，不再把面板内容顶下去、也不挡顶部按钮；刷新、改设置、切换视图这类操作不再弹提示，只在页脚更新状态。"
categories = ["tools"]
engines.openidea = "^1.4"
wasm = "dist/plugin.wasm"
activation = ["on-view:watchlist"]

[capabilities]
required = ["storage"]
optional = ["net:push2.eastmoney.com"]

[[contributes.commands]]
id = "refresh"
title = "Stock Watch: 刷新行情"
category = "Stock Watch"

[[contributes.commands]]
id = "clear"
title = "Stock Watch: 清空自选"
category = "Stock Watch"

[[contributes.commands]]
id = "toggle-stealth"
title = "Stock Watch: 切换隐匿模式"
category = "Stock Watch"

[[contributes.keymaps]]
command = "toggle-stealth"
key = "Alt+Shift+H"
mac = "Meta+Shift+H"

[[contributes.views]]
id = "watchlist"
title = "股票盯盘"
location = "right"
web = "web/index.html"

[contributes.settings]
title = "Stock Watch 股票盯盘"
schema = "settings.schema.json"

[[contributes.statusBar]]
id = "stockwatch.index"
text = "盯盘"
tooltip = "点击刷新行情"
command = "refresh"
